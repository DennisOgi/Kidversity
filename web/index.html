<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Kidversity — Mandarin lessons, Nigerian exam practice, and live class play for curious learners.">
  <meta name="theme-color" content="#4433CC">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Kidversity">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=doorway">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=doorway"/>

  <title>Kidversity</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #f5f6fb;
      overflow: hidden;
    }
    #loading {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 32px;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: #20213b;
      background: #f5f6fb;
      text-align: center;
      transition: opacity 260ms ease, visibility 260ms ease;
    }
    #loading.loaded {
      opacity: 0;
      visibility: hidden;
    }
    .splash-mark { width: 56px; height: 56px; }
    .splash-bar {
      margin-top: 28px;
      width: 72px;
      height: 3px;
      border-radius: 99px;
      background: #daddea;
      overflow: hidden;
    }
    .splash-bar i {
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 99px;
      background: #4433cc;
      animation: splash-load 1.1s ease-in-out infinite;
    }
    @keyframes splash-load {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .splash-bar i { animation: none; width: 100%; }
    }
  </style>
</head>
<body>
  <!-- Pulled in by supabase_flutter (passkeys_web plugin). Kidversity uses email/password only;
       this script satisfies the plugin on web. Bundled locally — no GitHub CDN at runtime. -->
  <script src="passkeys/bundle.js"></script>

  <div id="loading" role="status" aria-label="Loading Kidversity">
    <svg class="splash-mark" viewBox="0 0 64 64" aria-hidden="true">
      <path fill="#4433CC" fill-rule="evenodd" d="M8 60V28C8 14.745 18.745 4 32 4C45.255 4 56 14.745 56 28V60Z M26 60V29C26 23.477 30.477 19 36 19C41.523 19 46 23.477 46 29V60Z"/>
    </svg>
    <div class="splash-bar"><i></i></div>
  </div>

  <script>
    window.__kidversityBootStartedAt = performance.now();
    console.info('[Kidversity boot] Plan B bootstrap v1 started');
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      var elapsed = Math.round(performance.now() - window.__kidversityBootStartedAt);
      console.info('[Kidversity boot] Flutter first frame after ' + elapsed + 'ms');
      if (el) {
        el.classList.add('loaded');
        window.setTimeout(function () { el.remove(); }, 280);
      }
    });
  </script>

  <script src="flutter_bootstrap.js?v=plan-b-v1" async></script>
</body>
</html>
