<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ACE: Cambridge AS and A2 Mathematics and Physics. Study a topic, write your working, check your answer and learn from worked solutions.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ACE">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ACE · Advance. Conquer. Excel.</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #0B1F3A; }
    #boot {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 80% 15%, rgba(242,169,0,.18), transparent 45%),
                  radial-gradient(circle at 15% 85%, rgba(47,111,237,.22), transparent 50%),
                  linear-gradient(135deg, #071530, #0B1F3A 55%, #13305F);
      transition: opacity .35s ease;
    }
    #boot .tile {
      width: 96px; height: 96px; border-radius: 28px; background: #F2A900;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 60px rgba(242,169,0,.45);
      animation: boot-pulse 1.6s ease-in-out infinite;
    }
    @keyframes boot-pulse { 0%,100% { transform: scale(.94); } 50% { transform: scale(1); } }
  </style>
</head>
<body>
  <!-- Shown until Flutter paints its own animated splash. -->
  <div id="boot" aria-label="ACE is loading">
    <div class="tile">
      <svg width="58" height="58" viewBox="0 0 24 24" fill="none" stroke="#0B1F3A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 17L17 7"/><path d="M8 7h9v9"/>
      </svg>
    </div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var b = document.getElementById('boot');
      if (!b) return;
      b.style.opacity = '0';
      setTimeout(function () { b.remove(); }, 400);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
